<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CDC Online Test</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#16181d; --muted:#5d6472; --line:#e2e5ea;
  --brand:#1f4e9c; --brand-ink:#ffffff; --brand-soft:#e8eef9;
  --ok:#1a7f4b; --ok-soft:#e3f4ea; --bad:#c0362c; --bad-soft:#fbe8e6;
  --warn:#a35c00; --warn-soft:#fdf1df; --mark:#6a3fb5; --mark-soft:#efe8fb;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115; --card:#181b21; --ink:#e8eaee; --muted:#9aa2b1; --line:#2a2f38;
    --brand:#6c9cf0; --brand-ink:#0b1220; --brand-soft:#1b2740;
    --ok:#4cc38a; --ok-soft:#14291f; --bad:#f07067; --bad-soft:#331816;
    --warn:#f0a94a; --warn-soft:#2f2412; --mark:#b08cf0; --mark-soft:#261d38;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.wide{max-width:1100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
h1{font-size:22px;line-height:1.25;margin:0 0 6px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1 1 auto}
.stack>*+*{margin-top:12px}
label.f{display:block}
label.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;min-height:42px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.alert{padding:11px 13px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-weight:500}
.alert.info{background:var(--brand-soft);color:var(--brand)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.hidden{display:none!important}
.center{text-align:center}
.brandbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
ul.rules{margin:6px 0 0;padding-left:20px}
ul.rules li{margin:4px 0}

/* ---------- exam ---------- */
body.exam{user-select:none;-webkit-user-select:none}
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1100px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:10px}
.topbar .t{flex:1;min-width:0}
.topbar .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--brand-soft);color:var(--brand)}
.timer.low{background:var(--bad-soft);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.sync{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.sync.pending{background:var(--warn)}.sync.off{background:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:13px}
.tab.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.exam-grid{max-width:1100px;margin:0 auto;padding:0 12px 96px;display:grid;grid-template-columns:1fr 290px;gap:14px;align-items:start}
@media (max-width:860px){.exam-grid{grid-template-columns:1fr}.side{display:none}}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}
.qtext{font-size:16.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:9px;cursor:pointer;background:var(--card);white-space:pre-wrap;word-break:break-word}
.opt:hover{border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--card)}
.opt.sel .k{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line)}
.bottombar .in{max-width:1100px;margin:0 auto;padding:10px 12px;display:flex;gap:8px;align-items:center}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pq{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;cursor:pointer;position:relative}
.pq.v{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pq.a{background:var(--ok);color:#fff;border-color:var(--ok)}
.pq.m{background:var(--mark);color:#fff;border-color:var(--mark)}
.pq.a.m::after{content:"";position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--ok);border:1.5px solid #fff}
.pq.cur{outline:2.5px solid var(--brand);outline-offset:1px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:640px){.overlay{align-items:center;padding:16px}}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
@media (min-width:640px){.sheet{border-radius:16px}}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.big{font-size:40px;font-weight:800;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw}

/* ---------- admin ---------- */
.atabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto}
.atab{padding:10px 14px;border:none;background:none;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.atab.on{color:var(--brand);border-bottom-color:var(--brand)}
.tlist .card{cursor:pointer}
.qprev{border-top:1px solid var(--line);padding:10px 0;font-size:13.5px}
.qprev ol{margin:6px 0 0;padding-left:22px}
.qprev li.c{color:var(--ok);font-weight:700}
.copybox{display:flex;gap:6px}
.copybox input{font-size:13px}
details>summary{cursor:pointer;font-weight:600;padding:4px 0}
.pill{white-space:nowrap}
.exam-grid{padding-top:12px}
.bottombar .btn{white-space:nowrap;padding:10px 12px}
@media (max-width:520px){.qhead .secname{display:none}.bottombar .in{gap:6px}.bottombar .btn{padding:10px 9px}}
@media (max-width:520px){.atab{padding:10px 9px}.wrap{padding:12px}.card{padding:14px}}

</style>
